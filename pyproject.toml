[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mcp"
version = "0.0.1"
description = "Authorization and audit gateway for AI agent tool calls (MCP)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Fija aquí la versión EXACTA que anotaste con `pip show mcp` (ADR-007).
    # Ejemplo de forma: "mcp==X.Y.Z"
    "mcp== 2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]